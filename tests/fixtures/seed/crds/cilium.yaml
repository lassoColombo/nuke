apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: web-allow-frontend
  namespace: default
spec:
  description: Frontend may reach web on 8080
  endpointSelector:
    matchLabels:
      app: web
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: frontend
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
  egressDeny:
    - toCIDR:
        - 169.254.169.254/32
