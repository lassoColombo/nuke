# Two client-certificate requests from the same CSR blob (its key was
# discarded at generation): one left pending, one the seed script approves
# (label seed.nuke/approve), which the apiserver's signer then issues.
apiVersion: certificates.k8s.io/v1
kind: CertificateSigningRequest
metadata:
  name: alice-pending
spec:
  signerName: kubernetes.io/kube-apiserver-client
  expirationSeconds: 86400
  usages: [client auth]
  request: 
---
apiVersion: certificates.k8s.io/v1
kind: CertificateSigningRequest
metadata:
  name: alice-approved
  labels:
    seed.nuke/approve: "true"
spec:
  signerName: kubernetes.io/kube-apiserver-client
  usages: [client auth]
  request: 
