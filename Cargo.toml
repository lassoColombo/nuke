[package]
name = "nu_plugin_nuke"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nu_plugin_nuke"
path = "src/main.rs"

[dependencies]
nu-plugin = "0.116"
nu-protocol = "0.116"
kube = "3.0.1"
k8s-openapi = { version = "0.27.0", features = ["latest"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = "1"
serde_json = "1"
anyhow = "1"
futures = "0.3"
http = "1"
chrono = "0.4"
percent-encoding = "2"
